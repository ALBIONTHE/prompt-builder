<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanwha Radar Prompt Builder</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');:root{color-scheme:dark;--bg:#08111f;--panel:#111e30;--line:#2b3c51;--text:#eaf3ff;--muted:#9aacc1;--blue:#4aa8ff;--orange:#ff842d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#18395b,transparent 38%),var(--bg);font-family:'Noto Sans KR',sans-serif;color:var(--text)}header{padding:28px max(24px,calc((100vw - 1260px)/2));border-bottom:1px solid var(--line)}.eyebrow{color:var(--orange);font-size:12px;font-weight:800;letter-spacing:2px}h1{font-size:29px;margin:8px 0}header p,.hint{color:var(--muted);font-size:13px;line-height:1.7}.layout{max-width:1260px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(320px,440px) minmax(0,1fr);gap:20px}.panel{background:#101d2de8;border:1px solid var(--line);border-radius:16px;padding:22px}.panel h2{font-size:17px;margin:0 0 18px}.field{margin:0 0 17px}label{display:block;color:#d8e5f5;font-size:13px;font-weight:700;margin-bottom:7px}select,input,textarea{width:100%;background:#091523;border:1px solid #33465d;border-radius:9px;padding:11px;color:var(--text);font:inherit;font-size:13px}textarea{resize:vertical;min-height:72px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.mode button{background:#0b1726;border:1px solid var(--line);color:#b9cce0;padding:12px 8px;border-radius:10px;cursor:pointer}.mode button.active{background:#173b5b;border-color:var(--blue);color:white}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggle{display:flex;gap:9px;align-items:center;margin:13px 0;font-size:13px}.toggle input{width:auto;accent-color:var(--orange)}input[type=range]{padding:0;accent-color:var(--blue)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 16px}button.action{border:1px solid #45617c;background:#19334d;color:white;border-radius:9px;padding:11px 15px;font:inherit;font-size:13px;cursor:pointer}button.primary{background:var(--orange);border-color:var(--orange);color:#101720;font-weight:800}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#081421;border:1px solid #26394f;padding:22px;border-radius:12px;line-height:1.85;font-size:13px;min-height:540px;max-height:75vh;overflow:auto}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:8px 0}.note{border-left:3px solid var(--orange);padding:10px 14px;background:#1a2533;color:#b9c9dc;font-size:12px;line-height:1.7}.right{position:sticky;top:16px;align-self:start}@media(max-width:850px){.layout{grid-template-columns:1fr}.right{position:static}pre{max-height:none}}@media(max-width:440px){.twocol{grid-template-columns:1fr}}</style><script type="text/javascript" nonce="3a0da6c7649f4b6b83b7059288e" src="//local.adguard.org?ts=1794878760940&amp;type=content-script&amp;dmn=chatgpt.com&amp;url=https%3A%2F%2Fchatgpt.com%2Fbackend-api%2Festuary%2Fcontent%3Fid%3Dfile_00000000092881fabe7538f73d92ae66%26fn%3Dprompt_builder.html%26cd%3Dattachment%26ts%3D498577%26p%3Dfs%26cid%3D1%26sig%3D7d156b6195dadc5c7c4a7b123458cd63932d2d0096f45505ced4ba6d87d8859b%26v%3D0&amp;app=chrome.exe&amp;css=2&amp;js=1&amp;rel=1&amp;rji=1&amp;sbe=1"></script><script type="text/javascript" nonce="3a0da6c7649f4b6b83b7059288e" src="//local.adguard.org?ts=1794878760940&amp;name=AdGuard%20Extra&amp;name=AdGuard%20Popup%20Blocker&amp;type=user-script"></script></head><body><header><div class="eyebrow">HANWHA SYSTEMS / CREATIVE LAB</div><h1>레이더 이미지 프롬프트 빌더</h1><p>원본 7대 설계 기준과 미니멀 시네마틱 프롬프트를 기반으로 제작한 편집형 도구 · 이미지 생성 기능은 포함하지 않습니다.</p></header><main class="layout"><section class="panel"><h2>01 · 제작 방식</h2><div class="mode"><button id="cinematic" class="active" onclick="setMode('cinematic')">미니멀 시네마틱</button><button id="technical" onclick="setMode('technical')">7대 기준 인포그래픽</button></div><div class="field"><label for="subject">주요 피사체</label><input id="subject" value="지상 방공 다기능레이다(MFR) 1기"></div><div class="twocol"><div class="field"><label for="ratio">화면 비율</label><select id="ratio"><option>16:9 와이드</option><option>21:9 울트라와이드</option><option>4:3</option><option>1:1 정사각형</option><option>9:16 세로</option></select></div><div class="field"><label for="angle">카메라 구도</label><select id="angle"><option>낮은 카메라의 3/4 시점</option><option>정면 대칭 구도</option><option>측면 로우앵글</option><option>넓은 환경을 담는 와이드샷</option></select></div></div><div class="field"><label for="environment">배경 환경</label><select id="environment"><option>블루아워의 가상 한국 해안·산악 지형</option><option>새벽 안개가 낀 산악 지형</option><option>해 질 무렵의 해안 지형</option><option>절제된 다크 스튜디오 배경</option></select></div><div class="twocol"><div class="field"><label for="light">조명</label><select id="light"><option>영화적 역광과 절제된 볼류메트릭 라이트</option><option>부드러운 블루아워 자연광</option><option>드라마틱한 측면 조명</option><option>정제된 산업용 제품 조명</option></select></div><div class="field"><label for="palette">색상 테마</label><select id="palette"><option>딥 네이비 + 일렉트릭 블루 + 소량의 한화 오렌지</option><option>딥 네이비 + 시안 + 화이트</option><option>차콜 + 스틸 블루 + 한화 오렌지</option></select></div></div><div class="field"><label for="density">정보 밀도 <span id="densityLabel">5%</span></label><input id="density" type="range" min="0" max="100" value="5"></div><div class="twocol"><div class="field"><label for="targets">공중 표적</label><select id="targets"><option value="none">없음</option><option value="one">먼 하늘에 전투기 실루엣 1개</option><option value="multiple">탄도·순항미사일, 전투기, 무인기 개념 표적</option></select></div><div class="field"><label for="beam">탐지 시각화</label><select id="beam"><option>은은한 청색 탐지 빔 1개</option><option>반투명 탐지 호 1개</option><option>탐지 효과 없음</option><option>표적별 청색 추적선</option></select></div></div><div class="field"><label for="title">이미지 제목</label><input id="title" value="한화시스템 방공 레이다체계"></div><div class="field"><label for="subtitle">부제</label><input id="subtitle" value="공중 위협을 탐지하고 추적하는 핵심 센서"></div><div class="toggle"><input id="textOn" type="checkbox" checked><label for="textOn" style="margin:0">제목 및 부제 표시</label></div><div class="toggle"><input id="c2" type="checkbox"><label for="c2" style="margin:0">지휘통제 및 방공체계 연동 개념 추가</label></div><div class="toggle"><input id="flow" type="checkbox"><label for="flow" style="margin:0">5단계 정보 흐름도 추가</label></div><div class="field"><label for="extra">추가 지시사항</label><textarea id="extra" placeholder="예: 레이더를 화면 왼쪽에 배치하고 오른쪽 여백을 넓게 확보"></textarea></div><div class="note">정확성 원칙: 공개적으로 확인되지 않은 성능·제원은 기재하지 않고, 공식 참조 사진이 없는 장비는 개념 형태로만 묘사합니다. 공식 로고가 없다면 임의로 생성하지 않습니다.</div></section><section class="panel right"><h2>02 · 실시간 생성 프롬프트</h2><div class="actions"><button class="action primary" onclick="copyPrompt()">프롬프트 복사</button><button class="action" onclick="download('md')">Markdown 다운로드</button><button class="action" onclick="download('txt')">TXT 다운로드</button><button class="action" onclick="resetAll()">초기화</button></div><div class="meta"><span id="modeName">미니멀 시네마틱</span><span id="count">0자</span></div><pre id="output" aria-live="polite"></pre></section></main><script>let mode='cinematic';const $=id=>document.getElementById(id);function setMode(m){mode=m;$('cinematic').classList.toggle('active',m==='cinematic');$('technical').classList.toggle('active',m==='technical');$('modeName').textContent=m==='cinematic'?'미니멀 시네마틱':'7대 기준 인포그래픽';$('density').value=m==='cinematic'?5:65;$('targets').value=m==='cinematic'?'one':'multiple';$('beam').value=m==='cinematic'?'은은한 청색 탐지 빔 1개':'표적별 청색 추적선';$('c2').checked=m==='technical';$('flow').checked=m==='technical';$('title').value=m==='cinematic'?'한화시스템 방공 레이다체계':'한화시스템 레이더 기반 통합방공체계';$('subtitle').value=m==='cinematic'?'공중 위협을 탐지하고 추적하는 핵심 센서':'공중 위협 탐지·추적 및 방공체계 연동';render()}function val(id){return $(id).value.trim()}function render(){let density=Number(val('density'));$('densityLabel').textContent=density+'%';let minimal=mode==='cinematic';let lines=[`# ${minimal?'미니멀 시네마틱 키비주얼':'7대 설계 기준 기술 인포그래픽'} 이미지 생성 프롬프트`,'',`## 역할 (Role)`,minimal?'당신은 프리미엄 방산 브랜드 캠페인의 시네마틱 키비주얼을 제작하는 아트디렉터이자 사실적 3D 환경 아티스트입니다.':'당신은 글로벌 방위산업 기술 홍보자료를 제작하는 수석 아트디렉터이자 군사 시스템 시각화 전문가입니다.','',`## 맥락 및 목표 (Context / Task)`,`한화시스템의 공개적으로 확인 가능한 레이더 관련 기술을 주제로 ${val('ratio')} 이미지를 제작하세요.`,minimal?'단일 피사체, 충분한 여백, 영화적인 빛과 스케일로 주제를 전달하세요. 정보가 적더라도 장식과 패널을 추가하지 마세요.':'레이더의 탐지·식별·추적과 지휘통제 및 방공체계 연동 개념을 명확한 시각적 정보 구조로 설명하세요.','',`## 구도 및 핵심 요소 (Composition)`,`- 주인공: ${val('subject')}`,`- 구도: ${val('angle')}`,`- 배경: ${val('environment')}`,`- 탐지 효과: ${val('beam')}`,`- 공중 표적: ${val('targets')==='none'?'배치하지 않음':val('targets')==='one'?'먼 하늘에 전투기 실루엣 최대 1개':'탄도미사일·순항미사일·전투기·무인기 개념 표적'}`,`- 정보성 UI 목표 밀도: ${density}% (시각적 가이드이며 정량 측정값이 아님)`,`- 레이더는 평면형 배열 안테나와 기계적 디테일을 사실적으로 표현하되, 공식 실물 사진이 없으면 실물과 혼동되지 않는 일반화된 개념 장비로 표현하세요.`];if($('c2').checked)lines.push('- 레이더 탐지정보 → 지휘통제 정보 융합·위협 평가 → 연동 요격체계(개념도)의 개념적 관계를 표현하세요. 요격체계를 한화시스템 자체 제품으로 표기하지 마세요.');if($('flow').checked)lines.push('- 정보 흐름도: ① 탐지 → ② 식별 → ③ 추적 → ④ 정보 융합 → ⑤ 방공체계 연동.');lines.push('',`## 시각 스타일 (Style)`,`- 색상: ${val('palette')}`,`- 조명: ${val('light')}`,'- 사실적인 금속 재질, 고해상도 3D 디테일, 현대적인 기업 프레젠테이션 품질','- 기존 한화시스템 이미지 시리즈의 색상 분위기를 유지하되 불필요한 그래픽 요소는 줄이세요.','');if($('textOn').checked)lines.push('## 이미지 내 텍스트',`- 제목: ${val('title')}`,`- 부제: ${val('subtitle')}`,'- Noto Sans KR 계열의 현대적인 고딕 서체. 공식 로고 에셋이 없는 경우 로고를 생성하지 마세요.','');lines.push('## 제약 (Constraints / Negative Prompt)','- 타사 무기체계를 한화시스템 제품으로 묘사하지 마세요.','- 공개적으로 검증되지 않은 탐지거리, 요격고도, 명중률, 동시 추적 수치 등을 작성하지 마세요.','- 실제 군사시설의 정확한 위치나 운용 배치를 재현하지 마세요.','- 가짜 로고, 왜곡된 한글, 의미 없는 문자, 과도한 폭발·네온·렌즈 플레어를 배제하세요.');if(minimal)lines.push('- 불필요한 패널, 범례, 카드, 아이콘, 다수의 장비, 복잡한 HUD, 네트워크 연결선을 배제하세요.','- 화면의 70~80%는 하나의 영화적 장면으로, 정보성 UI는 가급적 0~10%로 제한하세요.','- 화면이 비어 보인다면 새 요소를 추가하지 말고 여백·빛·지형·구도를 개선하세요.');lines.push('','## 품질 검증 (QA)','- 관람자가 3초 이내에 레이더라는 핵심 주제를 이해할 수 있어야 합니다.','- 장비 외형과 제품 귀속 관계에 대해 근거 없는 단정을 하지 마세요.','- 읽기 어려운 문구와 중복 정보를 제거하세요.');if(!minimal)lines.push('- 레이더, 표적, 지휘통제 및 연동 요격체계의 역할을 시각적으로 구분하세요.','- 우측 하단에 “공개 기술 기반 개념도 | 실제 체계 구성과 다를 수 있음”을 표기하세요.');if(val('extra'))lines.push('','## 추가 지시',val('extra'));$('output').textContent=lines.join('\n');$('count').textContent=$('output').textContent.length.toLocaleString()+'자'}async function copyPrompt(){try{await navigator.clipboard.writeText($('output').textContent);alert('프롬프트를 복사했습니다.')}catch(e){const t=document.createElement('textarea');t.value=$('output').textContent;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('프롬프트를 복사했습니다.')}}function download(ext){let blob=new Blob([$('output').textContent],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hanwha_radar_prompt_'+mode+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function resetAll(){setMode('cinematic');$('subject').value='지상 방공 다기능레이다(MFR) 1기';$('ratio').selectedIndex=0;$('angle').selectedIndex=0;$('environment').selectedIndex=0;$('light').selectedIndex=0;$('palette').selectedIndex=0;$('textOn').checked=true;$('extra').value='';render()}document.querySelectorAll('input,select,textarea').forEach(el=>el.addEventListener('input',render));setMode('cinematic');</script></body></html>
